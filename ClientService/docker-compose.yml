# Local infrastructure for the whole EcoWash platform (Postgres + RabbitMQ).
# Run from this folder:  docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: ecowash-postgres
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
  rabbitmq:
    image: rabbitmq:3-management
    container_name: ecowash-rabbitmq
    ports: ["5672:5672", "15672:15672"]
volumes:
  pgdata:
